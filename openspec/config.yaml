schema: spec-driven

rules:
  specs:
    - "Specs may define test-suite capabilities (dependencies, offline execution, performance), but SHALL NOT specify 'watchdog' tests whose sole purpose is to fail if test data is missing or incomplete."
    - "Enforce test completeness and configuration coverage through code review, not through runtime watchdog tests in CI."
  tasks:
    - "Do not create permanent 'meta-tests' (tests that audit test data files, test runners, or test helpers)."
    - "When modifying test infrastructure or loaders, the verification is that the actual test suite runs and passes—do not add tests that test the test harness."

operations:
  apply:
    guidance:
      - "Distinguish durable regression tests from temporary verification scaffolding; keep test verification focused on the system under test."
      - "If you need one-off checks to audit data files or verify a test-loader refactor, use disposable scratchpad scripts and delete them before completing the task; do not enshrine them into the permanent test suite."
  archive:
    guidance:
      - "Verify that no ephemeral verification scripts, scratchpad files, or test-of-tests scaffolding leaked into the permanent test suite before archiving."
